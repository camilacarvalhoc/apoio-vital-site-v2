<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Simbolo da Apoio Vital: uma linha de batimento cardiaco que percorre a imagem e se transforma no contorno de um coracao.">
  <defs>
    <linearGradient id="av-fundo" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#f0f8f6"/>
      <stop offset="1" stop-color="#e2f0ed"/>
    </linearGradient>
    <linearGradient id="av-coracao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#246170"/>
      <stop offset="1" stop-color="#1F5D6B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#av-fundo)"/>

  <!-- halos concentricos -->
  <circle cx="400" cy="300" r="268" fill="#ffffff" opacity=".38"/>
  <circle cx="400" cy="300" r="204" fill="#ffffff" opacity=".55"/>
  <circle cx="400" cy="300" r="140" fill="#ffffff" opacity=".5"/>

  <!-- simbolo oficial, em escala -->
  <g transform="translate(92 196) scale(3.42)">
    <!-- linha de batimento -->
    <path d="M4 50 H58 L66 50 L72 40 L78 60 L85 20 L92 58 L98 50 H116"
          fill="none" stroke="#8fc5bc" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- coracao -->
    <path d="M116 50 C114 36 120 24 132 24 C140 24 145 30 146 36 C147 30 152 24 160 24 C172 24 178 36 176 46 C173 60 158 68 146 76 C134 68 122 60 116 50"
          fill="none" stroke="url(#av-coracao)" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- pontos de apoio -->
  <circle cx="158" cy="146" r="10" fill="#8fc5bc" opacity=".65"/>
  <circle cx="664" cy="452" r="13" fill="#5aa296" opacity=".5"/>
  <circle cx="668" cy="150" r="7"  fill="#1F5D6B" opacity=".28"/>
  <circle cx="142" cy="454" r="16" fill="#8fc5bc" opacity=".4"/>
  <circle cx="400" cy="548" r="8"  fill="#246170" opacity=".3"/>
</svg>
